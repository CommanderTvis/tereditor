name: Slow checks

# Suites too slow or too heavy for every push: dispatched by hand (Actions, Slow checks, Run workflow, or
# `gh workflow run slow.yml -f suite=browser`). The regular CI workflow stays the merge gate.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        options: [browser, native-macos, slow-cases, all]
        default: browser

permissions:
  contents: read

env:
  # Every tool must come from the mise lock files, with their checksums.
  MISE_LOCKED: '1'

concurrency:
  group: slow-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true

jobs:
  # The gate cases marked slow (Gate.Case(..., slow: true)): the language server cases that ci.yml's merge gate leaves out
  # (docs/develop/agent-reference.md, Gate options). ci.yml runs --lane merge; this runs the rest, so nothing is left unrun.
  slow-cases:
    if: inputs.suite == 'slow-cases' || inputs.suite == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/tereditor
            !~/.cache/tereditor/ghostty-avalonia
            !~/.cache/tereditor/zig
          key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/tereditor/ghostty-avalonia
            ~/.cache/tereditor/zig
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Ghostty.Avalonia/Native/**', 'scripts/build-ghostty-*.cs', 'scripts/lib/Native.cs', 'scripts/lib/Tasks.cs', 'mise.toml') }}
          restore-keys: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props') }}
      - run: |
          git config --global user.name CI
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - env:
          TEREDITOR_CHECKS_KEEP_GOING: "1"
          TEREDITOR_CHECKS_RESULTS: ${{ runner.temp }}/checks-results
          TEREDITOR_CHECKS_ROOT: ${{ runner.temp }}/checks-fixtures
        run: sh scripts/mise x -- dotnet run --file scripts/ci-run.cs -- "Slow gate cases" sh scripts/mise run check -- --lane slow
      - if: failure()
        uses: ./.github/actions/diagnostics
        with:
          name: slow-cases
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-fixtures-slow
          path: ${{ runner.temp }}/checks-fixtures
          if-no-files-found: ignore
          retention-days: 7
  # The WASM client in Chromium through Playwright: native selection, browser acceptance (Settings overlay, prose, Mermaid,
  # PDF), local approval and terminal hover (`scripts/mise run browser check`, see scripts/README.md). Not part of CI.
  browser:
    if: inputs.suite == 'browser' || inputs.suite == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/tereditor
            ~/.cache/ms-playwright
          key: tools-browser-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'mise.browser.toml', 'mise.browser.lock') }}
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props') }}
      - run: |
          git config --global user.name CI
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - env:
          TEREDITOR_CHECKS_KEEP_GOING: "1"
        run: sh scripts/mise x -- dotnet run --file scripts/ci-run.cs -- "Browser checks" sh scripts/mise run browser check
      - if: failure()
        uses: ./.github/actions/diagnostics
        with:
          name: slow-browser

  # The real-window Ghostty/Metal modes (they open windows and take focus, so they never run on a developer's machine).
  # A hosted macOS runner may not give Metal a usable GPU: a failure here can be the runner, read the log before blaming a change.
  native-macos:
    if: inputs.suite == 'native-macos' || inputs.suite == 'all'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/mise
            ~/.cache/tereditor
            !~/.cache/tereditor/ghostty-avalonia
            !~/.cache/tereditor/zig
          key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'mise.lock') }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/tereditor/ghostty-avalonia
            ~/.cache/tereditor/zig
          key: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Ghostty.Avalonia/Native/**', 'scripts/build-ghostty-*.cs', 'scripts/lib/Native.cs', 'scripts/lib/Tasks.cs', 'mise.toml') }}
          restore-keys: ghostty-v1-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props') }}
      - run: |
          git config --global user.name CI
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - env:
          TEREDITOR_CHECKS_KEEP_GOING: "1"
        run: sh scripts/mise x -- dotnet run --file scripts/ci-run.cs -- "Native terminal" sh scripts/mise run check -- --native-terminal
      - env:
          TEREDITOR_CHECKS_KEEP_GOING: "1"
        run: sh scripts/mise x -- dotnet run --file scripts/ci-run.cs -- "Native texture" sh scripts/mise run check -- --native-texture
      - if: failure()
        uses: ./.github/actions/diagnostics
        with:
          name: slow-native-macos
